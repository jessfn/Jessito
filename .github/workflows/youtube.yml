name: Publicar en YouTube

on:
  schedule:
    # Horas en UTC (Mexico = UTC-6, sin horario de verano)
    - cron: "0 15 * * *"  # 9:00 am hora de Mexico
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        run: npm install

      - name: Crear y subir el video del dia
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: npm run youtube

      - name: Guardar historial de lecciones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kids_history.json
          git diff --staged --quiet || git commit -m "Actualizar historial de videos de YouTube"
          git pull --rebase --autostash
          git push
