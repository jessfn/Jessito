#cap{position:absolute;left:30px;right:30px;top:118px;text-align:center;color:#fff;font-size:37px;line-height:1.16;font-weight:900;-webkit-text-stroke:7px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000;letter-spacing:.3px}
#chip{display:inline-block;font-size:21px;padding:5px 16px;border-radius:20px;margin-bottom:8px;-webkit-text-stroke:0;color:#fff;text-shadow:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#dreamTint{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px 60px rgba(255,120,220,.55);opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,rgba(160,80,255,.25) 100%)}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px 40px rgba(0,0,0,.55)}

#topbar{position:absolute;left:24px;top:22px;right:24px;display:flex;justify-content:space-between;align-items:center}
#brand{font-size:24px;color:#ffe27a;-webkit-text-stroke:5px #000;paint-order:stroke fill}
#day{font-size:22px;background:#ff3d7f;color:#fff;border-radius:20px;padding:6px 18px;border:3px solid #fff}
#hook{position:absolute;left:30px;right:30px;top:250px;text-align:center;color:#ffe27a;font-size:50px;line-height:1.1;-webkit-text-stroke:9px #000;paint-order:stroke fill;opacity:0}
#choices{position:absolute;left:0;right:0;top:290px;height:240px;opacity:1}
.card{position:absolute;top:0;width:204px;height:240px;border-radius:26px;background:linear-gradient(#fff,#ffe9f4);border:6px solid #ff3d7f;box-shadow:0 10px 0 #7a1240;text-align:center;opacity:0;transform:scale(.3)}
.card .lt{position:absolute;left:-14px;top:-18px;width:54px;height:54px;border-radius:50%;background:#ff3d7f;border:4px solid #fff;color:#fff;font-size:30px;line-height:54px}
.card .nm{position:absolute;left:0;right:0;bottom:16px;font-size:30px;color:#6a1240}
.card svg{position:absolute;left:32px;top:38px;width:140px;height:140px}
#cta{position:absolute;left:0;right:0;top:190px;opacity:0}
.btn{position:absolute;left:40px;right:40px;height:130px;border-radius:70px;color:#fff;font-size:42px;line-height:130px;text-align:left;padding-left:150px;border:6px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.45);-webkit-text-stroke:0}
.btn svg{position:absolute;left:26px;top:22px;width:84px;height:84px}
#teaser{position:absolute;left:0;right:0;top:640px;text-align:center;font-size:40px;color:#fff;-webkit-text-stroke:8px #000;paint-order:stroke fill;opacity:0}
