@font-face{font-family:'Mont';src:url(vendor/fonts/montserrat-latin-900-normal.woff2);font-weight:900;font-style:normal}
@font-face{font-family:'Pop';src:url(vendor/fonts/poppins-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;overflow:hidden;font-family:'Mont','Pop',sans-serif;background:#111}
#gl{position:absolute;left:0;top:0;width:720px;height:1280px}
#dinaWrap{position:absolute;transform-origin:50% 100%}
#sleepWrap{position:absolute;transform-origin:50% 50%}
#annWrap{position:absolute;transform-origin:50% 100%}
#cap{position:absolute;left:36px;right:36px;bottom:238px;text-align:center;font:800 33px/1.15 'Mont';text-transform:none;letter-spacing:0;display:none}
#cap .chip{display:inline-block;font:800 13px 'Pop';letter-spacing:2px;padding:3px 12px;border-radius:20px;color:#fff;margin-bottom:6px;border:2px solid #fff;font-style:normal}
#cap .w{display:inline-block;margin:0 4px;color:#fff;-webkit-text-stroke:7px #12082a;paint-order:stroke fill;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55));transform-origin:50% 85%}
#cap .w.act{color:#ffe14a}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#dreamTint{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 220px 60px rgba(255,120,220,.55);opacity:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,rgba(160,80,255,.25) 100%)}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 200px 40px rgba(0,0,0,.55)}
#topbar{position:absolute;left:24px;top:122px;right:24px;display:flex;justify-content:center;align-items:center}
#dim{position:absolute;inset:0;background:rgba(6,2,20,.68);opacity:0;pointer-events:none}
#brand{font:italic 900 26px 'Mont';letter-spacing:1px;background:linear-gradient(90deg,#ffe27a,#ff5ab0,#7af6ff,#ffe27a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #1b0a3a) drop-shadow(0 0 6px rgba(255,90,176,.7))}
#day{font:800 28px 'Pop';letter-spacing:4px;background:linear-gradient(90deg,#ff3d7f,#ff8a3c);color:#fff;border-radius:26px;padding:8px 30px;border:3px solid #fff;box-shadow:0 5px 0 #7a1240;transform-origin:50% 50%}
.ttl{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.ttl .ln{display:block;line-height:1.0}
.k{position:relative;display:inline-block;margin:0 .12em;font-family:'Mont';font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:-.02em;color:transparent;filter:drop-shadow(0 .07em 0 var(--sh,#ff2d8a)) drop-shadow(0 0 .25em var(--gl,rgba(255,255,255,.6)));transform-origin:50% 70%}
.k::before,.k::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:nowrap}
.k::before{color:#1b0a3a;-webkit-text-stroke:.2em #1b0a3a}
.k::after{color:transparent;background-clip:text;-webkit-background-clip:text;background-image:var(--bg)}
.g1{--bg:linear-gradient(#fff 10%,#ffe14a 55%,#ff9a3c)}
.g2{--bg:linear-gradient(#fff 5%,#9ff4ff 45%,#ff6ad8);--sh:#6a2dff;--gl:rgba(120,240,255,.8)}
.g3{--bg:linear-gradient(#fff 5%,#ffe14a 50%,#ff5a8a);--sh:#00b0ff}
.g4{--bg:linear-gradient(#fff,#ff9ad0);--sh:#6a2dff}
.pt{position:absolute;width:34px;height:34px;opacity:0;pointer-events:none;margin:-17px 0 0 -17px}
#choices{position:absolute;left:0;right:0;top:520px;height:240px;transform:scale(.8)}
.card{position:absolute;top:0;width:204px;height:240px;border-radius:30px;background:linear-gradient(160deg,#fff,#ffd9ee);border:6px solid #ff2d8a;box-shadow:0 12px 0 #5a0f3a,0 0 30px rgba(255,45,138,.7);text-align:center;opacity:0}
.card .lt{position:absolute;left:-16px;top:-20px;width:58px;height:58px;border-radius:50%;background:linear-gradient(#ff5ab0,#ff2d8a);border:4px solid #fff;color:#fff;font:900 32px/52px 'Mont';font-style:italic}
.card .nm{position:absolute;left:0;right:0;bottom:14px;font:italic 900 27px/0.95 'Mont';color:#4a0f3a;letter-spacing:-.5px}
.card svg{position:absolute;left:32px;top:36px;width:140px;height:140px}
#vs{position:absolute;left:310px;top:80px;width:100px;height:100px;border-radius:50%;background:linear-gradient(#ffe14a,#ff9a3c);border:6px solid #fff;box-shadow:0 8px 0 #7a3a00;font:italic 900 40px/88px 'Mont';text-align:center;color:#4a0f3a;opacity:0}
#cta{position:absolute;left:0;right:0;top:300px}
#ctaCard{position:absolute;left:130px;width:460px;top:0;padding:8px 18px;border-radius:32px;background:linear-gradient(160deg,rgba(40,22,86,.78),rgba(14,8,40,.82));border:2px solid rgba(255,255,255,.38);box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(14px);opacity:0;transform-origin:50% 0}
#ctaCard .row{position:relative;display:flex;align-items:center;gap:14px;height:78px}
#ctaCard .sep{height:2px;margin:0 6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
#ctaCard .ic{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
#ctaCard .ic svg{width:26px;height:26px}
#ctaCard .tx{flex:1;line-height:1.05}
#ctaCard .tx b{display:block;font:800 25px 'Pop';color:#fff;letter-spacing:.2px}
#ctaCard .tx span{display:block;margin-top:3px;font:700 14px 'Pop';color:#c9c0ff;letter-spacing:.4px}
#ctaCard .ab{display:flex;gap:8px}
#ctaCard .ab i{width:38px;height:38px;border-radius:50%;font:900 20px/38px 'Mont';font-style:italic;text-align:center;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.8)}
#ctaCard .fol{font:800 17px 'Pop';color:#fff;padding:9px 18px;border-radius:22px;background:linear-gradient(90deg,#ff3d7f,#ff8a3c);box-shadow:0 5px 14px rgba(255,61,127,.55),inset 0 1px 0 rgba(255,255,255,.5);letter-spacing:.4px}
#ctaCard .shine{position:absolute;inset:0;border-radius:32px;overflow:hidden;pointer-events:none}

function placeDina(cx,bottom,h,rot,sx){const sc=h/940;dinaWrap.style.width=(420*sc)+'px';dinaWrap.style.height=h+'px';dinaWrap.style.left=(cx-420*sc/2)+'px';dinaWrap.style.top=(bottom-h)+'px';dinaWrap.style.transform=`rotate(${rot||0}deg) scale(${sx||1},1)`;$('dinaSvg').setAttribute('width',420*sc);$('dinaSvg').setAttribute('height',h)}
function placeAnn(cx,bottom,h){const sc=h/640;annWrap.style.width=(300*sc)+'px';annWrap.style.height=h+'px';annWrap.style.left=(cx-150*sc)+'px';annWrap.style.top=(bottom-h)+'px';$('ann').setAttribute('width',300*sc);$('ann').setAttribute('height',h)}
const projV=new THREE.Vector3();
function project(x,y,z){projV.set(x,y,z).project(camera);return [(projV.x*0.5+0.5)*W,(-projV.y*0.5+0.5)*H]}
const capStyle={narr:'#2d6cff',anun:'#8a3dff',crowd:'#ff8a3c',dina:'#ff2d8a'};

 glassMat.map=day>0.5?skyDay:skyNight;glassMat.needsUpdate=true;

 sunL.color.set(day>0.5?'#fff0d0':'#7f98e8');sunL.intensity=lerp(1.0,2.0,day);
 lampL.intensity=lerp(1.4,0.35,day);shadeM.emissiveIntensity=lerp(1.0,0.25,day);
}

const eob=x=>{x=Math.max(0,Math.min(1,x));const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const SCSTART=[0,T.S1,T.S2,T.S3,T.S4,T.S5];
let capId=-1,capRot=0;
const titles={};
function mkTitle(id,lines,cls,top,size){const d=document.createElement('div');d.id=id;d.className='ttl '+cls;d.style.top=top+'px';d.style.fontSize=size+'px';
 d.innerHTML=lines.map(l=>'<span class="ln">'+l.split(' ').map(w=>`<span class="k" data-t="${w}">${w}</span>`).join(' ')+'</span>').join('');$('stage').appendChild(d);return d}
function animTitle(d,t,t0,t1,stag){const ks=d.querySelectorAll('.k');let any=false;
 ks.forEach((k,i)=>{const a=t-t0-i*stag;const kin=eob(a/0.4);const out=ease((t-t1)/0.28);const vis=a>0&&out<1;if(vis)any=true;
  const sc=(2.9-1.9*kin)*(1-0.5*out);const rot=(i%2?1:-1)*(16*(1-kin))+(i%2?1:-1)*Math.sin(t*2.4+i)*1.2;const y=-90*(1-kin)-50*out+Math.sin(t*3+i*.8)*3;
  k.style.opacity=vis?Math.min(1,a/0.08)*(1-out):0;k.style.transform=`translateY(${y}px) rotate(${rot}deg) scale(${sc})`});
 d.style.display=any?'block':'none'}
titles.hook=mkTitle('hook',['¿Y SI TÚ DECIDES','SU CAMBIO?'],'g1',360,84);
titles.dream=mkTitle('dream',['EL SUEÑO'],'g2',470,128);
titles.day1=mkTitle('day1',['DÍA 1'],'g3',500,170);
titles.tease=mkTitle('tease',['DÍA 2 → ???'],'g4',195,58);
const PT=[];const starSvg='<svg viewBox="0 0 40 40"><path d="M20,1 L25,15 L39,20 L25,25 L20,39 L15,25 L1,20 L15,15Z" fill="CC" stroke="#fff" stroke-width="2"/></svg>';
const heartSvg='<svg viewBox="0 0 40 40"><path d="M20,36 C2,22 4,6 14,6 C18,6 20,10 20,12 C20,10 22,6 26,6 C36,6 38,22 20,36Z" fill="CC" stroke="#fff" stroke-width="2.5"/></svg>';
for(let b=0;b<8;b++){PT[b]=[];for(let i=0;i<14;i++){const d=document.createElement('div');d.className='pt';$('stage').appendChild(d);PT[b].push(d)}}
function burst(b,t,t0,cx,cy,col,heart){const age=t-t0;const ps=PT[b];
 ps.forEach((d,i)=>{if(age<0||age>1.0){d.style.opacity=0;return}
  if(!d.dataset.c||d.dataset.c!==col+(heart?'h':'s')){d.innerHTML=(heart?heartSvg:starSvg).replace('CC',i%3?col:'#fff');d.dataset.c=col+(heart?'h':'s')}
  const a=i/14*Math.PI*2+(b*0.7);const r=ease(age/0.7)*(90+(i%4)*45);const g=age*age*120;
  d.style.opacity=Math.max(0,1-ease((age-0.45)/0.55)).toFixed(2);d.style.transform=`translate(${Math.cos(a)*r+cx}px,${Math.sin(a)*r+cy+g}px) scale(${(0.4+(1-age)*0.9+(i%3)*0.25).toFixed(2)}) rotate(${age*260*(i%2?1:-1)}deg)`;d.style.left='0px';d.style.top='0px'})}

const POSE={hang:[16,-6,4],wave:[100,78,0],cheer:[150,22,0],point:[158,6,0],hug:[10,-62,8],shrug:[50,44,-12],surp:[96,48,0]};
const KL=[[0,'hang'],[T.S2,'hang'],[T.S2+0.6,'cheer'],[T.S3-0.4,'cheer'],[T.S3,'surp'],[T.S3+1.5,'surp'],[T.S3+2.0,'hang'],[T.L7,'hang'],[T.L7+0.4,'hug'],[T.L8-0.2,'hug'],[T.L8+0.4,'cheer'],[T.L8+DUR.L8,'cheer'],[T.S4+0.3,'shrug'],[T.S5-0.3,'shrug'],[T.S5+0.5,'point'],[T.END+2,'point']];
const KR=[[0,'hang'],[0.7,'wave'],[T.S1-0.6,'wave'],[T.S1,'hang'],[T.S2,'hang'],[T.S2+0.9,'cheer'],[T.S3-0.4,'cheer'],[T.S3,'surp'],[T.S3+1.5,'surp'],[T.S3+2.0,'hang'],[T.L7,'hang'],[T.L7+0.4,'hug'],[T.L8-0.2,'hug'],[T.L8+0.6,'cheer'],[T.L8+DUR.L8,'cheer'],[T.S4+0.3,'shrug'],[T.S5-0.3,'shrug'],[T.S5+0.4,'wave'],[T.END+2,'wave']];
function poseAt(K,t){let i=0;while(i<K.length-1&&t>=K[i+1][0])i++;if(i>=K.length-1)return POSE[K[K.length-1][1]].slice();const a=POSE[K[i][1]],b=POSE[K[i+1][1]];const t1=K[i+1][0];const k=ease((t-(t1-0.45))/0.45);return a.map((v,j)=>v+(b[j]-v)*k)}
function setArm(side,ang,t,ph,G){
 let [a1,a2,a3]=ang;
 const r=Math.max(0,Math.min(1,(a1-70)/50));
 // idle sway with overlapping lag (shoulder leads, elbow and wrist follow)
 a1+=2.4*Math.sin(t*1.4+ph);a2+=3.6*Math.sin(t*1.4+ph-0.7);a3+=5*Math.sin(t*1.4+ph-1.4);
 // speech beat gestures
 a1+=7*G*Math.sin(t*6+ph);a2+=(r>0.3?5:16)*G*(0.5+0.5*Math.sin(t*7+ph-0.5));a3+=10*G*Math.sin(t*9+ph-1);
 // waving / cheering wiggle
 a3+=r*22*Math.sin(t*8+ph);a2+=r*8*Math.sin(t*8+ph-0.6);
 $('arm'+side).setAttribute('transform',`rotate(${a1.toFixed(2)})`);
 $('fore'+side).setAttribute('transform',`translate(0,108) rotate(${a2.toFixed(2)})`);
 $('hand'+side).setAttribute('transform',`translate(0,104) rotate(${a3.toFixed(2)}) scale(1.05)`);
}
function setAnnArms(t,G){
 const sw=Math.sin(t*1.5);
 const a1=14+G*(40+30*Math.sin(t*6))+2*sw, a2=-8-G*(30+20*Math.sin(t*7-0.5)), a3=4+G*14*Math.sin(t*9-1);
 $('annArmL').setAttribute('transform',`rotate(${a1.toFixed(2)})`);
 $('annForeL').setAttribute('transform',`translate(0,84) rotate(${a2.toFixed(2)})`);
 $('annHandL').setAttribute('transform',`translate(0,78) rotate(${a3.toFixed(2)})`);
 $('annArmR').setAttribute('transform',`rotate(${(Math.sin(t*2.1)*1.2+G*2*Math.sin(t*7)).toFixed(2)} 236 214)`);
}
function render(t){
 // scenes
 const sc=t<T.S1?0:t<T.S2?1:t<T.S3?2:t<T.S4?3:t<T.S5?4:5;
 const isStage=sc===2;
 bed.visible=!isStage;stg.visible=isStage;bumps.visible=(sc===1);
 scene.fog=isStage?new THREE.FogExp2('#150a30',0.011):null;
 scene.background=new THREE.Color(isStage?'#0a0518':'#000000');
 let sp=speaking(t);
 // ---- camera + 3D ----
 let sleepOn=false,standOn=false,annOn=false;
 let dayK=1;
 if(!isStage){
  if(sc===0){dayK=0.55;const k=ease((t)/(T.S1));camera.position.set(0,lerp(1.55,1.45,k),lerp(3.4,2.6,k));camera.lookAt(0,lerp(1.5,1.35,k),-3);standOn=true}
  else if(sc===1){dayK=0;const k=ease((t-T.S1)/(T.S2-T.S1));camera.position.set(lerp(0.6,0.1,k),lerp(2.1,1.7,k),lerp(3.4,1.9,k));camera.lookAt(0,lerp(0.9,0.8,k),-2.3);sleepOn=true}
  else {dayK=1;const k=ease((t-T.S3)/(T.S5-T.S3+3));camera.position.set(lerp(-0.2,0.15,k),1.45,lerp(2.9,2.55,k));camera.lookAt(0,1.4,-3);standOn=true}
  setBedroom(dayK);
  // flies
  flies.forEach((f,i)=>{const a=t*3+i*1.7;f.position.set(-1.0+Math.cos(a)*0.35,0.45+Math.sin(a*1.7)*0.12,-0.8+Math.sin(a)*0.35)});
  const dp=dust.geometry.attributes.position;for(let i=0;i<150;i++){dp.array[i*3+1]=(dp.array[i*3+1]+0.0007)%3;}dp.needsUpdate=true;
 } else {
  annOn=true;standOn=true;
  const k=(t-T.S2)/(T.S3-T.S2);camera.position.set(Math.sin(k*2.2)*1.1,2.0,7.6);camera.lookAt(0,1.5,-2);
  const beat=t*Math.PI*2*124/60/4;
  spots.forEach((s,i)=>{const a=t*0.9+i*1.3;s.target.position.set(Math.sin(a)*1.5,0.8,-1.5+Math.cos(a*.8));beams[i].lookAt(s.target.position)});
  crowd.forEach(g=>{const o=g.userData.off;const bob=Math.abs(Math.sin(t*5.2+o))*0.08;g.position.y=bob;g.userData.arms.forEach((a,j)=>{a.rotation.z=(j?-1:1)*(-0.35-Math.abs(Math.sin(t*3+o+j))*0.9)});});
  const cp=cfPts.geometry.attributes.position;for(let i=0;i<cfN;i++){const c=cf0[i];const yy=((c[1]-(t*1.2+c[3]))%6+6)%6;cp.array[i*3]=c[0]+Math.sin(t*2+c[3])*0.3;cp.array[i*3+1]=yy;cp.array[i*3+2]=c[2]}cp.needsUpdate=true;
  ledM.color.setScalar(0.85+0.15*Math.sin(beat*8));
 }
 renderer.render(scene,camera);
 // ---- Dina states ----
 sleepWrap.style.display='none';dinaWrap.style.display='none';annWrap.style.display='none';
 const blinkOn=(Math.floor(t*24)%58)<2;
 const speakDina=sp&&sp[1]==='dina';
 if(sleepOn){
  const k=ease((t-T.S1)/(T.S2-T.S1));
  const [px,py]=project(0,0.98,-2.55);const dist=camera.position.distanceTo(new THREE.Vector3(0,0.98,-2.55));
  const pxPerM=H/(2*dist*Math.tan(58*Math.PI/360));const w=1.05*pxPerM;
  sleepWrap.style.display='block';sleepWrap.style.width=w+'px';sleepWrap.style.height=(w*460/380)+'px';
  sleepWrap.style.left=(px-w/2)+'px';sleepWrap.style.top=(py-w*460/380*0.46)+'px';
  const br=1+Math.sin(t*2.2)*0.025;$('zz').setAttribute('transform',`translate(${Math.sin(t*1.5)*6},${-((t*30)%40)}) `);$('zz').setAttribute('opacity',(0.5+0.5*Math.sin(t*3)).toFixed(2));sleepWrap.style.transform=`rotate(-7deg) scale(${br})`;
  const sv=$('sleepSvg');sv.setAttribute('width',w);sv.setAttribute('height',w*460/380);
 }
 if(standOn){
  dinaWrap.style.display='block';
  const bob=Math.sin(t*2.6)*4;
  let expr='neutral',amp=null,rot=0,jump=0,sx=1,hgt=740,bottom=1170,cx=360;
  if(isStage){hgt=700;bottom=1000;cx=420;expr='happy';rot=Math.sin(t*5)*2.2;jump=-Math.abs(Math.sin(t*5.2))*26}
  else if(sc===0){expr='neutral';amp=null;rot=Math.sin(t*1.3)*1;hgt=660;bottom=1170}
  else if(sc>=3){
    const lid=sp&&sp[1]==='dina'?sp[0]:null;
    if(t<T.L7){expr=t<T.L6+1.6?'surp':'neutral'}
    else if(t<T.L8){expr='sad'}
    else if(t<T.S4){expr='happy'}
    else if(sc===4){expr='neutral'}
    else {expr='happy'}
    if(lid){amp=envAt(lid,t)}
    if(t<T.L6+0.5){const k=(t-T.S3)/0.6;jump=-Math.abs(Math.sin(Math.min(1,k)*Math.PI*2))*60*(1-Math.min(1,k))}
    if(sc===3&&t>=T.L7&&t<T.L8){rot=Math.sin(t*1.4)*1.5;bottom=1175}
    if(sc===4){hgt=600;bottom=1170}
    if(sc===5){hgt=470;bottom=985;jump=-Math.abs(Math.sin(t*4))*18;rot=Math.sin(t*3)*3}
  }
  if(speakDina&&amp===null)amp=envAt(sp[0],t);
  placeDina(cx,bottom+jump+bob*0.4,hgt,rot,sx);
  const G=speakDina&&amp!==null?Math.min(1,amp):0;setArm('L',poseAt(KL,t),t,0,G);setArm('R',poseAt(KR,t),t,1.3,G);
  const sway=Math.sin(t*1.1)*1.1+(speakDina?Math.sin(t*3.3)*0.8:0);dinaG.setAttribute('transform',`translate(${(Math.sin(t*0.9)*3).toFixed(1)},52) rotate(${sway.toFixed(2)} 450 880)`);
  const hr=Math.sin(t*2-0.5)*1.5+(speakDina?Math.sin(t*9)*1.2:0)-Math.sin(t*1.1)*0.7;
  dinaHead.setAttribute('transform',`translate(450,${196+Math.sin(t*2.6)*2}) rotate(${hr})`);
  setHead(expr,speakDina?amp:null,blinkOn);
 }
 if(annOn){annWrap.style.display='block';placeAnn(112,1002,600);
  const a=sp&&sp[1]==='anun'?envAt(sp[0],t):null;const m=$('annMouth');m.setAttribute('ry',(a===null?3:3+a*16).toFixed(1));
  annWrap.style.transform=`rotate(${Math.sin(t*2.4)*1.2}deg) translateY(${-Math.abs(Math.sin(t*3.5))*4}px)`;setAnnArms(t,a===null?0:Math.min(1,a))}
 // ---- overlays ----
 let f=0;for(const k of ['S1','S2','S3','S4','S5']){f=Math.max(f,1-Math.abs(t-T[k])/0.22)}
 flash.style.opacity=Math.max(0,f).toFixed(2);
 dreamTint.style.opacity=isStage?'1':'0';
 const dayEl=$('day');const dk=eob((t-0.1)/0.45);dayEl.style.transform=`scale(${(0.6+0.4*dk).toFixed(3)}) rotate(${((1-dk)*-8).toFixed(1)}deg)`;
 // kinetic titles
 animTitle(titles.hook,t,0.3,T.S1-0.1,0.22);
 animTitle(titles.dream,t,T.S2+0.1,T.S2+1.3,0.18);
 animTitle(titles.day1,t,T.S4+0.1,T.S4+1.5,0.15);
 animTitle(titles.tease,t,T.L10+DUR.L10-1.5,T.END+1,0.2);
 // particles
 burst(0,t,T.S2+0.12,360,560,'#9ff4ff');burst(1,t,T.S3+0.05,360,820,'#ffe14a');burst(2,t,T.S4+0.12,360,600,'#ff5ab0');
 DATA.cardT.forEach((ct,i)=>burst(3+i,t,ct-0.1,360+(i?1:-1)*135,640,['#ff2d8a','#7af6ff'][i]));
 burst(6,t,T.L10+DUR.L10*0.9+0.15,520,470,'#ff2d8a',true);burst(7,t,T.S5+0.4,360,380,'#ffe14a');
 // captions
 let ch=null;for(const c of DATA.chunks){if(t>=c.t0-0.02&&t<c.t1)ch=c}
 if(ch){cap.style.display='block';
  if(capId!==ch.id){capId=ch.id;cap.innerHTML=`<span class="chip" style="background:${capStyle[ch.who]}">${capName[ch.who]}</span><br>`+ch.words.map(w=>`<span class="w">${w.w}</span>`).join(' ');capRot=((ch.id*37)%7-3)*0.9}
  const ws=cap.querySelectorAll('.w');const age=t-ch.t0;
  ws.forEach((el,i)=>{const w=ch.words[i];const act=t>=w.t0&&t<w.t1+0.02;el.style.transform=`scale(${act?1.07:1})`;el.style.opacity=Math.min(1,(age+0.05)*12).toFixed(2);el.classList.toggle('act',act)});
 }else{cap.style.display='none'}
 
 // choices
 const chc=$('choices');chc.style.display=(sc===4)?'block':'none';const dimK=sc===4?Math.min(1,Math.max(0,(t-(DATA.cardT[0]-0.7))*2.5)):0;$('dim').style.opacity=dimK.toFixed(2);
 if(sc===4){const vk=eob((t-(DATA.cardT[1]-0.1))/0.4);$('vs').style.opacity=Math.min(1,Math.max(0,(t-(DATA.cardT[1]-0.1))*8)).toFixed(2);$('vs').style.transform=`scale(${(0.2+0.8*vk).toFixed(3)}) rotate(${(Math.sin(t*4)*6).toFixed(1)}deg)`;DATA.cardT.forEach((ct,i)=>{const t0=ct-0.2;const k=eob((t-t0)/0.45);const c=$('card'+i);c.style.opacity=Math.min(1,(t-t0)*8).toFixed(2);const wig=Math.sin((t-t0)*5+i)*2.2*Math.min(1,(t-t0)/0.5);c.style.transform=`scale(${(0.2+0.8*k).toFixed(3)}) rotate(${((1-k)*-25+wig).toFixed(2)}deg) translateY(${Math.sin(t*3+i)*4}px)`})}
 // cta
 const cta=$('cta');cta.style.display=sc===5?'block':'none';
 if(sc===5){const card=$('ctaCard');const t0=T.S5+0.15;const k=eob((t-t0)/0.6);card.style.opacity=Math.min(1,(t-t0)*7).toFixed(2);card.style.transform=`translateY(${(1-k)*70}px) scale(${(0.72+0.28*k).toFixed(3)})`;
 card.style.setProperty('--sx',(((t-t0)*260)%700-150)+'px');
 [['r1',0.25],['r2',0.4]].forEach(([id,d])=>{const kk=eob((t-t0-d)/0.4);const e=$(id);e.style.opacity=Math.min(1,(t-t0-d)*8).toFixed(2);e.style.transform=`translateX(${(1-kk)*60}px)`});
 $('chA').style.transform=`scale(${1+Math.max(0,Math.sin(t*5))*0.14})`;$('chB').style.transform=`scale(${1+Math.max(0,Math.sin(t*5+Math.PI))*0.14})`;
 $('fol').style.transform=`scale(${1+Math.sin(t*6)*0.06})`}
 return sc;
}
