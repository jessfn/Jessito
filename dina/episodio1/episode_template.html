function setArm(side,ang,t,ph,G){
 let [a1,a2,a3]=ang;

function render(t){
 // scenes

  const dp=dust.geometry.attributes.position;for(let i=0;i<150;i++){dp.array[i*3+1]=(dp.array[i*3+1]+0.0007)%3;}dp.needsUpdate=true;
 } else {

  const k=(t-T.S2)/(T.S3-T.S2);camera.position.set(Math.sin(k*2.2)*1.1,2.0,7.6);camera.lookAt(0,1.5,-2);

  const cp=cfPts.geometry.attributes.position;for(let i=0;i<cfN;i++){const c=cf0[i];const yy=((c[1]-(t*1.2+c[3]))%6+6)%6;cp.array[i*3]=c[0]+Math.sin(t*2+c[3])*0.3;cp.array[i*3+1]=yy;cp.array[i*3+2]=c[2]}cp.needsUpdate=true;

 }
 renderer.render(scene,camera);
