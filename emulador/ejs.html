<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; }
  #game { width:100%; height:100%; }
  /* Usamos los controles táctiles de Jessito Emu, no los de EmulatorJS */
  .ejs_virtualGamepad_parent, .ejs_menu_bar, .ejs_virtualGamepad_open { display:none !important; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  // Motor multi-consola: EmulatorJS (núcleos libretro: fceumm, snes9x, mgba, gambatte, genesis_plus_gx...)
  const g = parent.__ejsGame || {};
  window.EJS_player = '#game';
  window.EJS_core = g.core;
  window.EJS_gameUrl = g.url;
  window.EJS_gameName = g.name;
  if (g.bios) window.EJS_biosUrl = g.bios;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#7c5cff';
  window.EJS_volume = g.volume ?? 0.8;
  // Rendimiento: si el celular se atrasa, se salta cuadros de imagen (no la velocidad del juego)
  window.EJS_defaultOptions = {
    'virtual-gamepad': 'disabled',
    'shader': g.shader || 'disabled',   // calidad de imagen elegida en Ajustes
    'pcsx_rearmed_frameskip_type': 'auto',
    'snes9x_frameskip': 'auto',
    'mupen64plus-Framerate': 'Fullspeed',
  };
  window.EJS_onGameStart = () => parent.postMessage({ ejs: 'start' }, location.origin);
  // Reenviar el teclado al padre para que funcionen los mismos atajos
  ['keydown', 'keyup'].forEach(t => addEventListener(t, e => parent.dispatchEvent(new KeyboardEvent(t, { key: e.key }))));
</script>
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
