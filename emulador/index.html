<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Jessito Emu</title>
<style>
  :root { --bg:#0b0c1a; --card:#1a1c35; --line:#2f3366; --acc:#7c5cff; --acc2:#22d3ee; --txt:#eef0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; overflow:hidden; background:radial-gradient(120% 80% at 50% 0%,#2a2366,var(--bg) 60%); color:var(--txt); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; touch-action:none; overscroll-behavior:none; }
  svg.i { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .app { height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); }
  header { display:flex; align-items:center; gap:10px; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:grid; place-items:center; box-shadow:0 4px 16px #7c5cff66; }
  h1 { font-size:18px; margin:0; font-weight:800; letter-spacing:.3px; }
  h1 small { display:block; font-size:11px; font-weight:500; opacity:.55; }
  .spacer { flex:1; }
  .ib { width:42px; height:42px; display:grid; place-items:center; background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:13px; padding:0; cursor:pointer; transition:transform .08s, background .2s; }
  .ib:active { transform:scale(.9); background:#262a50; }
  .screen { position:relative; background:#04050b; border-radius:20px; padding:8px; box-shadow:0 0 0 1px var(--line), 0 10px 40px #7c5cff44; }
  canvas { width:100%; aspect-ratio:2/1; image-rendering:pixelated; display:block; border-radius:12px; }
  .hud { position:absolute; left:16px; bottom:14px; font-size:11px; padding:3px 8px; border-radius:99px; background:#ffffff14; backdrop-filter:blur(6px); }
  .games { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .chip { flex:none; display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:99px; background:var(--card); border:1px solid var(--line); color:var(--txt); font-size:14px; cursor:pointer; }
  .chip.sel { background:linear-gradient(135deg,var(--acc),#5b43e0); border-color:transparent; }
  .chip svg.i { width:18px; height:18px; }
  .controls { flex:1; display:flex; flex-direction:column; justify-content:flex-end; min-height:0; }
  .dpad { display:grid; grid-template-columns:1fr 1fr; gap:14px; height:min(34vh,220px); }
  .big { border-radius:28px; border:1px solid var(--line); background:linear-gradient(160deg,#2b2f5e,#191b34); color:var(--txt); display:grid; place-items:center; box-shadow:0 6px 0 #07081280; transition:transform .05s; }
  .big svg.i { width:56px; height:56px; stroke-width:2.5; }
  .pad { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .key { height:min(9.5vh,64px); font-size:22px; font-weight:700; border-radius:16px; border:1px solid var(--line); background:linear-gradient(160deg,#2b2f5e,#191b34); color:var(--txt); box-shadow:0 4px 0 #07081280; transition:transform .05s; }
  .on { transform:translateY(3px); box-shadow:0 1px 0 #07081280 !important; background:linear-gradient(160deg,var(--acc),#4f3bd1) !important; }
  .hidden { display:none !important; }
  .sheet { position:fixed; inset:0; background:#0008; display:flex; align-items:flex-end; z-index:5; }
  .sheet > div { width:100%; max-width:560px; margin:0 auto; background:#151730; border-radius:24px 24px 0 0; padding:18px 18px max(18px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:14px; }
  .sheet h2 { margin:0; font-size:16px; }
  .opt { display:flex; align-items:center; gap:10px; font-size:14px; }
  .opt input[type=range] { flex:1; accent-color:var(--acc); }
  .swatches { display:flex; gap:10px; }
  .sw { width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .sw.sel { border-color:#fff; }
  .toast { text-align:center; font-size:12px; opacity:.65; min-height:16px; }
  @media (orientation:landscape) and (max-height:520px) {
    .app { max-width:none; display:grid; grid-template-columns:1fr minmax(0,1.4fr) 1fr; grid-template-rows:auto 1fr auto; gap:8px 14px; }
    header { grid-column:1/-1; } .screen { grid-column:2; grid-row:2; align-self:center; }
    .games { grid-column:2; grid-row:3; justify-content:center; } .toast { display:none; }
    .controls { display:contents; }
    .dpad { display:contents; } .dpad .big { grid-row:2/4; height:100%; }
    .dpad .big:first-child { grid-column:1; } .dpad .big:last-child { grid-column:3; }
    .pad { grid-column:3; grid-row:2/4; align-self:center; } .key { height:42px; font-size:17px; }
  }
</style>
</head>
<body>
<!-- Iconos SVG modernos (trazos estilo Lucide) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-pad" viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5L12 11l2.5 2.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></symbol>
</svg>

<div class="app">
  <header>
    <div class="logo"><svg class="i"><use href="#i-pad"/></svg></div>
    <h1>Jessito Emu<small>CHIP-8 · táctil</small></h1>
    <div class="spacer"></div>
    <button class="ib" id="pause" aria-label="Pausa"><svg class="i"><use href="#i-pause"/></svg></button>
    <button class="ib" id="reset" aria-label="Reiniciar"><svg class="i"><use href="#i-reset"/></svg></button>
    <button class="ib" id="sound" aria-label="Sonido"><svg class="i"><use href="#i-vol"/></svg></button>
    <button class="ib" id="cfg" aria-label="Ajustes"><svg class="i"><use href="#i-gear"/></svg></button>
  </header>

  <div class="screen"><canvas id="cv" width="64" height="32"></canvas><div class="hud" id="hud">Elige un juego</div></div>

  <div class="games">
    <button class="chip" data-game="atrapa"><svg class="i"><use href="#i-star"/></svg>Atrapa</button>
    <button class="chip" data-game="teclas"><svg class="i"><use href="#i-grid"/></svg>Teclas</button>
    <label class="chip"><svg class="i"><use href="#i-folder"/></svg>Cargar ROM<input id="file" type="file" hidden></label>
    <button class="chip" id="toggleKeys"><svg class="i"><use href="#i-keys"/></svg>Teclado</button>
  </div>
  <div class="toast" id="toast">Mueve la barra y atrapa las pelotas</div>

  <div class="controls">
    <div class="dpad" id="dpad">
      <button class="big" data-k="4" aria-label="Izquierda"><svg class="i"><use href="#i-left"/></svg></button>
      <button class="big" data-k="6" aria-label="Derecha"><svg class="i"><use href="#i-right"/></svg></button>
    </div>
    <div class="pad hidden" id="pad"></div>
  </div>
</div>

<div class="sheet hidden" id="sheet"><div>
  <h2>Ajustes</h2>
  <div class="opt">Velocidad<input id="speed" type="range" min="2" max="40" value="12"></div>
  <div class="opt">Color<div class="swatches" id="sw"></div></div>
  <button class="chip" id="closeCfg" style="justify-content:center">Listo</button>
</div></div>

<script>
// ===== Núcleo CHIP-8 =====
const FONT=[0xF0,0x90,0x90,0x90,0xF0,0x20,0x60,0x20,0x20,0x70,0xF0,0x10,0xF0,0x80,0xF0,0xF0,0x10,0xF0,0x10,0xF0,0x90,0x90,0xF0,0x10,0x10,0xF0,0x80,0xF0,0x10,0xF0,0xF0,0x80,0xF0,0x90,0xF0,0xF0,0x10,0x20,0x40,0x40,0xF0,0x90,0xF0,0x90,0xF0,0xF0,0x90,0xF0,0x10,0xF0,0xF0,0x90,0xF0,0x90,0x90,0xE0,0x90,0xE0,0x90,0xE0,0xF0,0x80,0x80,0x80,0xF0,0xE0,0x90,0x90,0x90,0xE0,0xF0,0x80,0xF0,0x80,0xF0,0xF0,0x80,0xF0,0x80,0x80];
class Chip8{
  reset(rom){this.mem=new Uint8Array(4096);this.mem.set(FONT,0);this.V=new Uint8Array(16);this.I=0;this.pc=0x200;this.stack=[];this.dt=0;this.st=0;
    this.disp=new Uint8Array(2048);this.keys=new Array(16).fill(false);this.waitReg=-1;this.dirty=true;
    if(rom){this.mem.set(rom.slice(0,3584),0x200);this.rom=rom;}}
  keyDown(k){this.keys[k]=true;if(this.waitReg>=0){this.V[this.waitReg]=k;this.waitReg=-1;}}
  keyUp(k){this.keys[k]=false;}
  tick(){if(this.dt)this.dt--;if(this.st)this.st--;}
  step(){
    if(this.waitReg>=0)return;
    const m=this.mem,V=this.V,op=(m[this.pc]<<8)|m[this.pc+1];this.pc=(this.pc+2)&0xFFF;
    const x=(op>>8)&15,y=(op>>4)&15,n=op&15,nn=op&255,nnn=op&0xFFF;
    switch(op>>12){
      case 0: if(op===0x00E0){this.disp.fill(0);this.dirty=true;} else if(op===0x00EE)this.pc=this.stack.pop()??0x200; break;
      case 1: this.pc=nnn;break;
      case 2: this.stack.push(this.pc);this.pc=nnn;break;
      case 3: if(V[x]===nn)this.pc+=2;break;
      case 4: if(V[x]!==nn)this.pc+=2;break;
      case 5: if(V[x]===V[y])this.pc+=2;break;
      case 6: V[x]=nn;break;
      case 7: V[x]=(V[x]+nn)&255;break;
      case 8: {let f;switch(n){
        case 0:V[x]=V[y];break;case 1:V[x]|=V[y];V[15]=0;break;case 2:V[x]&=V[y];V[15]=0;break;case 3:V[x]^=V[y];V[15]=0;break;
        case 4:{const s=V[x]+V[y];V[x]=s&255;V[15]=s>255?1:0;break;}
        case 5:f=V[x]>=V[y]?1:0;V[x]=(V[x]-V[y])&255;V[15]=f;break;
        case 6:f=V[y]&1;V[x]=V[y]>>1;V[15]=f;break;
        case 7:f=V[y]>=V[x]?1:0;V[x]=(V[y]-V[x])&255;V[15]=f;break;
        case 14:f=V[y]>>7;V[x]=(V[y]<<1)&255;V[15]=f;break;}break;}
      case 9: if(V[x]!==V[y])this.pc+=2;break;
      case 10: this.I=nnn;break;
      case 11: this.pc=(nnn+V[0])&0xFFF;break;
      case 12: V[x]=(Math.random()*256|0)&nn;break;
      case 13: {const sx=V[x]%64,sy=V[y]%32;V[15]=0;
        for(let r=0;r<n;r++){const py=sy+r;if(py>=32)break;const b=m[(this.I+r)&0xFFF];
          for(let c=0;c<8;c++){const px=sx+c;if(px>=64)break;if(b&(0x80>>c)){const i=py*64+px;if(this.disp[i])V[15]=1;this.disp[i]^=1;}}}
        this.dirty=true;break;}
      case 14: if(nn===0x9E&&this.keys[V[x]&15])this.pc+=2;else if(nn===0xA1&&!this.keys[V[x]&15])this.pc+=2;break;
      case 15: switch(nn){
        case 0x07:V[x]=this.dt;break;case 0x0A:this.waitReg=x;break;case 0x15:this.dt=V[x];break;case 0x18:this.st=V[x];break;
        case 0x1E:this.I=(this.I+V[x])&0xFFF;break;case 0x29:this.I=(V[x]&15)*5;break;
        case 0x33:m[this.I]=V[x]/100|0;m[this.I+1]=(V[x]/10|0)%10;m[this.I+2]=V[x]%10;break;
        case 0x55:for(let i=0;i<=x;i++)m[(this.I+i)&0xFFF]=V[i];this.I=(this.I+x+1)&0xFFF;break;
        case 0x65:for(let i=0;i<=x;i++)V[i]=m[(this.I+i)&0xFFF];this.I=(this.I+x+1)&0xFFF;break;}break;
    }
  }
}

// ===== Juegos originales =====
const hex=s=>new Uint8Array(s.replace(/\s+/g,'').match(/../g).map(h=>parseInt(h,16)));
const GAMES={
  // "Atrapa": mueve la barra con 4/6 y atrapa las pelotas que caen. Puntos arriba a la derecha.
  atrapa:{name:'Atrapa',pad:true,hint:'Mueve la barra y atrapa las pelotas',rom:hex(`
    00E0 601C 611E 6400 226A A292 D011 6E00 6E00 2274
    6503 F515 6504 E5A1 2252 6506 E5A1 225E A293 D232 7301 D232 3F01 123C D232 2274 7401 2274 226A 124A
    331F 124A D232 2274 6400 2274 226A
    F507 3500 124A 1214
    A292 D011 3000 70FE D011 00EE
    A292 D011 3038 7002 D011 00EE
    C23E 6306 A293 D232 00EE
    A298 F255 A295 F433 F265 6C1A 6D01 F129 DCD5 7C05 F229 DCD5 A298 F265 00EE
    FFC0C0 000000 000000`)},
  // "Teclas": muestra la tecla que toques
  teclas:{name:'Teclas',pad:false,hint:'Toca una tecla para verla en pantalla',rom:hex('6A1C 6B0D 00E0 F00A F029 00E0 DAB5 1206')},
};

// ===== Interfaz =====
const cpu=new Chip8(),cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let store={};try{store=JSON.parse(localStorage.getItem('jemu')||'{}');}catch(e){}
let running=false,soundOn=store.sound??true,color=store.color||'#a5f3fc',audio,gain,lastBeep=false;
const save=()=>{try{localStorage.setItem('jemu',JSON.stringify({sound:soundOn,color,speed:+$('speed').value}));}catch(e){}};
if(store.speed)$('speed').value=store.speed;

function draw(){if(!cpu.dirty)return;cpu.dirty=false;ctx.fillStyle='#04050b';ctx.fillRect(0,0,64,32);ctx.fillStyle=color;
  for(let i=0;i<2048;i++)if(cpu.disp[i])ctx.fillRect(i%64,i/64|0,1,1);}
function initAudio(){if(audio){audio.resume();return;}audio=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator();gain=audio.createGain();
  o.type='square';o.frequency.value=520;gain.gain.value=0;o.connect(gain).connect(audio.destination);o.start();}
function beep(on){on=on&&soundOn;if(!audio||on===lastBeep)return;lastBeep=on;gain.gain.setTargetAtTime(on?0.06:0,audio.currentTime,0.01);}
cpu.reset();cpu.dirty=true;
let last=0,acc=0;
function loop(t){if(running){acc+=Math.min(t-last,100);while(acc>=1000/60){acc-=1000/60;const s=+$('speed').value;for(let i=0;i<s;i++)cpu.step();cpu.tick();}beep(cpu.st>0);}else beep(false);
  last=t;draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

const icon=(el,id)=>el.querySelector('use').setAttribute('href','#'+id);
function setPad(game){$('dpad').classList.toggle('hidden',!game);$('pad').classList.toggle('hidden',!!game);}
function start(rom,name,hint,usePad){initAudio();cpu.reset(rom);running=true;icon($('pause'),'i-pause');$('hud').textContent=name;$('toast').textContent=hint||'';setPad(usePad);}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{const g=GAMES[b.dataset.game];
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));b.classList.add('sel');start(g.rom,g.name,g.hint,g.pad);});

// Controles táctiles: multi-touch con pointer events
function bindKey(el,k){
  const down=e=>{e.preventDefault();initAudio();el.setPointerCapture?.(e.pointerId);el.classList.add('on');cpu.keyDown(k);navigator.vibrate?.(10);};
  const up=e=>{e.preventDefault();el.classList.remove('on');cpu.keyUp(k);};
  el.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,up));
  el.addEventListener('contextmenu',e=>e.preventDefault());}
const LAYOUT=[1,2,3,0xC,4,5,6,0xD,7,8,9,0xE,0xA,0,0xB,0xF];
LAYOUT.forEach(k=>{const b=document.createElement('button');b.className='key';b.textContent=k.toString(16).toUpperCase();bindKey(b,k);$('pad').appendChild(b);});
document.querySelectorAll('[data-k]').forEach(b=>bindKey(b,+b.dataset.k));

const KEYMAP={'1':1,'2':2,'3':3,'4':0xC,'q':4,'w':5,'e':6,'r':0xD,'a':7,'s':8,'d':9,'f':0xE,'z':0xA,'x':0,'c':0xB,'v':0xF,'arrowleft':4,'arrowright':6};
addEventListener('keydown',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k!==undefined&&!e.repeat)cpu.keyDown(k);});
addEventListener('keyup',e=>{const k=KEYMAP[e.key.toLowerCase()];if(k!==undefined)cpu.keyUp(k);});

$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));
  start(new Uint8Array(await f.arrayBuffer()),f.name.replace(/\.\w+$/,''),'ROM cargada · usa el teclado',false);};
$('toggleKeys').onclick=()=>setPad($('pad').classList.contains('hidden')?false:true);
$('pause').onclick=()=>{if(!cpu.rom)return;running=!running;icon($('pause'),running?'i-pause':'i-play');};
$('reset').onclick=()=>{if(cpu.rom){cpu.reset(cpu.rom);running=true;icon($('pause'),'i-pause');}};
$('sound').onclick=()=>{soundOn=!soundOn;icon($('sound'),soundOn?'i-vol':'i-mute');save();};
icon($('sound'),soundOn?'i-vol':'i-mute');
$('cfg').onclick=()=>$('sheet').classList.remove('hidden');
$('closeCfg').onclick=$('sheet').onclick=e=>{if(e.target===$('sheet')||e.target===$('closeCfg')){$('sheet').classList.add('hidden');save();}};
['#a5f3fc','#86efac','#fcd34d','#f9a8d4','#c4b5fd','#ffffff'].forEach(c=>{const s=document.createElement('div');s.className='sw'+(c===color?' sel':'');s.style.background=c;
  s.onclick=()=>{color=c;cpu.dirty=true;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');save();};$('sw').appendChild(s);});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running){running=false;icon($('pause'),'i-play');}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
