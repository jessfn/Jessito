# Sitio de nginx para el servidor de juegos. certbot agrega el bloque HTTPS automáticamente.
server {
    listen 80;
    listen [::]:80;
    server_name gamesdata.geodatos.com.mx;

    # Subidas grandes (discos de PlayStation) sin guardarlas en memoria ni en disco de nginx
    client_max_body_size 0;   # sin límite (el servidor cuida el espacio libre del disco)
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3077;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
