// subtitle chunks
const CH=[];SEGS.forEach((s,i)=>{const ws=s.words;let j=0;while(j<ws.length){let n=(ws.length-j)==4?2:3;n=Math.min(n,ws.length-j);if(n==1&&CH.length&&CH[CH.length-1].si==i&&CH[CH.length-1].ws.length<4){CH[CH.length-1].ws.push(ws[j]);j++;continue;}CH.push({si:i,s0:ST[i],ws:ws.slice(j,j+n)});j+=n;}});
function subs(t){
  let cur=null;
  for(let ci=0;ci<CH.length;ci++){const c=CH[ci];const a=c.s0+c.ws[0][1];const nx=CH[ci+1];const b=(nx&&nx.si==c.si)?nx.s0+nx.ws[0][1]:c.s0+c.ws[c.ws.length-1][2]+.25;if(t>=a-.02&&t<b){cur={a,b,c};break;}}
  if(!cur)return;
  const {a,c}=cur;const sc=eb((t-a)/.16)*.12+.88;const size=88;
  g.font=`900 ${size}px ${FONT}`;
  const words=c.ws.map(w=>w[0].toUpperCase());const widths=words.map(w=>g.measureText(w).width);const sp=44;
  const total=widths.reduce((a,b)=>a+b,0)+sp*(words.length-1);const scl=Math.min(1,920/total);
  let x=540-total*scl/2;const y=1330;
  c.ws.forEach((w,wi)=>{const active=(c.s0+w[1]-.02<=t&&t<c.s0+w[2]+.05)||(t>=c.s0+w[2]&&wi==c.ws.length-1);
    txt(words[wi],x+widths[wi]*scl/2,y,size,active?'#ffe228':'#fff',{stroke:10,shadow:6,scale:sc*scl*(active?1.06:1)});x+=(widths[wi]+sp)*scl;});
}
function stamp(t,t0,s,col,x,y,rot,size){const u=t-t0;if(u<0)return;const k=eb(u/.28);const sc=Math.max(.05,.4+.6*k);
  g.save();g.translate(x,y);g.rotate(rot*Math.PI/180);g.scale(sc,sc);g.globalAlpha=clamp(u/.1);
  g.font=`900 ${size}px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.shadowColor=col;g.shadowBlur=34;g.fillStyle=col;g.fillText(s,0,0);g.shadowBlur=0;g.fillText(s,0,0);g.restore();}

// ---------- scene params ----------
const K=(a)=>a; // helper
function bhParams(t,s){
  const u=t-ST[s],d=ENDS[s]-ST[s];const p=u/d;
  const DS=[[46,38],[38,31],[31,26],[26,22],[22,22],[52,56],[26,9],[60,64]][s];
  let D=lerp(DS[0],DS[1],eio(p));
  let inc=.16+.05*Math.sin(t*.25);let yaw=.04*Math.sin(t*.2);let shift=.2;let fade=1,flash=0;
  if(s===6){inc=.35;yaw=0;fade=1-eio((p-.72)/.28);shift=.2*(1-p*.5);}
  if(s===5){inc=.12;}
  if(s===7){inc=.2;}
  return {D,inc,yaw,shift,fade,flash};
}
const SHADOW_SIN=(D)=>2.6/D*Math.sqrt(Math.max(0.01,1-1/D));
function shadowPx(D,shift){const a=Math.asin(Math.min(.99,SHADOW_SIN(D)));return 1.8*Math.tan(a)/Math.tan(THREE.MathUtils.degToRad(18))*(H/2);}
function bhCenterY(shift){return H/2+shift*(H/2);} // px from top

// figure state per scene
function figState(t,s){
  const u=t-ST[s],d=ENDS[s]-ST[s],p=clamp(u/d);
  let x=540,y=640,sc=.72,rz=0,ry=.4,rx=0,sy=1,sxz=1,flail=.8,red=0,dim=0,vis=1,tpos=t,arm=.3,leg=.6;
  const cyc=Math.sin(t*.8);
  if(s===0){y=lerp(790,840,eio(t/ENDS[0]));rz=.3*Math.sin(t*.9);ry=.5+.4*Math.sin(t*.6);sc=.85*(0.35+0.65*eb(t/.8));x=540+60*Math.sin(t*.7);arm=-.15;leg=.7;}
  if(s===1){arm=-.35;leg=.5;sc=.85;y=lerp(840,870,eio(p));rz=.2*Math.sin(t*.9)-.15*p;ry=.3*Math.sin(t*.6);x=540+40*Math.sin(t*.7);}
  if(s===2){sc=.85;arm=.35;leg=.3;y=lerp(870,900,p);rz=.1*Math.sin(t*.8);ry=.25*Math.sin(t*.5);flail=.5;x=540;}
  if(s===3){sc=lerp(.85,.7,eio(p));arm=lerp(.35,-1.2,eio(p));leg=lerp(.3,0,p);y=560+1.7*sc*sy*PX*.98/2;rz=lerp(.1,0,p);ry=.2*Math.sin(t*.5);sy=lerp(1,1.45,eio(p));sxz=lerp(1,.92,p);flail=.6;}
  if(s===4){sc=lerp(.7,.5,eio(p));arm=lerp(-1.2,-2.3,eio(p));leg=0;rz=0;ry=.15*Math.sin(t*.5);sy=lerp(1.45,2.7,Math.pow(eio(p),1.3));sxz=lerp(.92,.72,eio(p));flail=lerp(.6,.2,p);red=.1*p;y=560+1.7*sc*sy*PX*.98/2;}
  if(s===5){ // outside view: frozen at the edge, redshifting
    const sh=shadowPx(bhParams(t,5).D,0.2);const cy=bhCenterY(.2);
    x=540;sc=.5;arm=-.5;leg=.2;rz=0;ry=.5;sy=lerp(1.5,1.9,p);sxz=.85;y=cy-sh-14-1.7*sc*sy*PX*.98/2;flail=.5*(1-eo(p*1.6));
    tpos=ST[5]+Math.min(u,1.4)+(1-Math.exp(-u*1.2))*.6; // time dilation: pose nearly stops
    red=.55*eo(p*1.1);dim=.3*eo(p*1.2);
    sc=.5*(1-.12*p);y=cy-sh-14-1.7*sc*sy*PX*.98/2;
  }
  if(s===6){const q=eio(p);const cy=bhCenterY(bhParams(t,6).shift);x=540+40*Math.sin(p*18)*(1-q);y=lerp(cy-520,cy+30,q);arm=-2.2;leg=0;sc=.45*(1-.3*q);sy=lerp(3.4,5.5,q);sxz=lerp(.5,.14,q);rz=.5*Math.sin(p*12)*(1-q);red=1;dim=.5+.5*q;flail=0;vis=1-eo((p-.82)/.18);}
  if(s===7){x=540;y=900;sc=.85;arm=.3;leg=.2;flail=.2;ry=.05;rz=0;}
  return {x,y,sc,rz,ry,rx,sy,sxz,flail,red,dim,vis,tpos,arm,leg};
}

const SHOTS=[[wordT(0,'espagueti')-.15,wordT(0,'espagueti')+1.9,4.0],[ST[1]+.7,ST[1]+2.9,3.4],[ST[2]+.5,ST[2]+3.0,3.6],[ST[3]+.9,ST[3]+2.5,3.8],[ST[4]+1.1,ST[4]+3.2,4.2],[ST[6]+.4,ST[6]+3.7,3.6],[ST[7]+.2,TOTAL+2,3.3]];
function shotAt(t){let b=0,Z=1;for(const [a,c,z] of SHOTS){const up=eo((t-a)/.25),dn=1-eo((t-c)/.25);const v=Math.min(up,dn);if(v>b){b=v;Z=z;}}return {b,Z};}
const _hv=new THREE.Vector3(),_hv2=new THREE.Vector3();
function headPx(){bones.Head.getWorldPosition(_hv);bones.HeadTop_End.getWorldPosition(_hv2);_hv.add(_hv2).multiplyScalar(.5);return [540+_hv.x*PX,960-_hv.y*PX];}
const SCENES_WORDS={explot:wordT(0,'espagueti'),cong:wordT(5,'congelarte'),espag:wordT(4,'espaguetización')};
function frame(t){
  const s=sceneAt(t),u=t-ST[s];
  const bp=bhParams(t,s);
  const U=bhMat.uniforms;U.uTime.value=t;U.uDist.value=bp.D;U.uInc.value=bp.inc;U.uYaw.value=bp.yaw;U.uShift.value=bp.shift;U.uFade.value=bp.fade;
  // flash at scene change
  U.uFlash.value=(u<.12&&s>0)?.25*(1-u/.12):0;
  const f=figState(t,s);
  holder.visible=f.vis>0.02;
  // pose
  const fw=applyFace(f.tpos);if(window.POSEOVR)window.POSEOVR();else pose(f.tpos,f.flail,f.arm,f.leg);
  const scl=f.sc*(1.7/ (window.FIG_REF||FIG_H));
  holder.scale.set(scl*f.sxz,scl*f.sy,scl*f.sxz);
  holder.position.set((f.x-540)/PX,-(f.y-960)/PX,0);
  holder.rotation.set(f.rx,f.ry,f.rz);
  const sh=shotAt(t);
  if(sh.b>0.001){
    fig.position.y=-0.935;holder.updateMatrixWorld(true);const Hw=headPx();
    const sclC=0.85*(1.7/FIG_H)*sh.Z,sc2_=lerp(scl,sclC,sh.b);const sy_=lerp(f.sy,1,sh.b),sx_=lerp(f.sxz,1,sh.b);
    holder.scale.set(sc2_*sx_,sc2_*sy_,sc2_*sx_);holder.rotation.set(f.rx*(1-sh.b),f.ry*(1-sh.b)+.05*sh.b,f.rz*(1-sh.b));
    holder.updateMatrixWorld(true);const H2=headPx();const T=[540,s===7?900:880];
    const want=[lerp(Hw[0],T[0],sh.b),lerp(Hw[1],T[1],sh.b)];
    holder.position.x+=(want[0]-H2[0])/PX;holder.position.y-=(want[1]-H2[1])/PX;
  }
  fill.intensity=lerp(1.2,2.8,sh.b);
  // feet toward BH: figure origin at feet -> shift so center is at body center
  fig.position.y=-0.935;
  const shake=Math.max(0,1-u/.35)*.02;holder.position.x+=shake*Math.sin(t*90);
  mats.forEach(m=>{if(m.userData.c0){m.color.copy(m.userData.c0).lerp(new THREE.Color(.9,.12,.04),f.red*.85).multiplyScalar(1-f.dim*.7);}if(m.emissive){m.emissive.copy(m.userData.e0).lerp(new THREE.Color(.5,.05,0),f.red*.5);}});
  key.intensity=5.0*(1-f.dim*.6);rim.intensity=4.0*(1-f.dim*.7);
  const _fi=Math.round(t*30);if(!window.NOBH&&(!window._bhOnce||_fi%2===0)){window._bhOnce=true;r.setRenderTarget(rt);r.render(bhScene,cam);r.setRenderTarget(null);}else{r.setClearColor(0x0a0c1a,1);}
  r.render(scene,cam);
  // ----- 2D composite
  g.clearRect(0,0,W,H);g.drawImage(glc,0,0);
  overlays(t,s,u,bp,f);

  if(t<.2){g.fillStyle=`rgba(0,0,0,${1-t/.2})`;g.fillRect(0,0,W,H);}
  if(t>TOTAL-.5){g.fillStyle=`rgba(0,0,0,${clamp((t-(TOTAL-.5))/.5)})`;g.fillRect(0,0,W,H);}
}
function inset(t,s,u,bp,f,w){
  let cx=900,cy=940,Rb=125;if(s===7){const k=eio(u/.8);cx=lerp(900,540,k);cy=lerp(940,930,k);Rb=lerp(125,150,k);}

  orange2.intensity=s<=4?lerp(.3,2.8,clamp((t-ST[1])/ (ST[4]-ST[1]))):(s===5?0.6:1.4);
  placeCam2();r2.render(sc2,cam2);
  g.save();g.globalAlpha=vis;g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.clip();
  g.drawImage(glc2,cx-R,cy-R,2*R,2*R);
  g.globalCompositeOperation='soft-light';g.fillStyle='rgba(255,150,95,0.55)';g.fillRect(cx-R,cy-R,2*R,2*R);
  g.globalCompositeOperation='multiply';
  if(s===5){const k=eo(u/1.2)*(1-f.red*.9);g.fillStyle=`rgba(${Math.round(255-95*k)},${Math.round(255-55*k)},255,1)`;g.fillRect(cx-R,cy-R,2*R,2*R);

  if(s===6){g.fillStyle=`rgba(255,120,90,1)`;g.fillRect(cx-R,cy-R,2*R,2*R);}

function arrow(x,y,len,w,col,label){g.save();g.fillStyle=col;g.shadowColor=col;g.shadowBlur=22;g.beginPath();g.moveTo(x-w/2,y);g.lineTo(x+w/2,y);g.lineTo(x+w/2,y+len);g.lineTo(x+w*1.1,y+len);g.lineTo(x,y+len+w*1.4);g.lineTo(x-w*1.1,y+len);g.lineTo(x-w/2,y+len);g.closePath();g.fill();g.restore();}
function overlays(t,s,u,bp,f){

  }

  }

    txt('DEJA DE GIRAR?',540,725,96,'#ff9a2e',{shadow:6,alpha:eo((u-.8)/.4)});
    if(u>2.2){const bp=1+.07*Math.sin((u-2.2)*7);g.save();g.translate(540,1205);g.scale(bp,bp);g.fillStyle='#ff2a5a';rrect(-260,-65,520,130,65);g.fill();g.restore();txt('SÍGUEME ▶',540,1205,60,'#fff',{scale:bp});}
  }
}
function FIG_PX(f){return 1.7*f.sc*f.sy*PX*0.98;}
