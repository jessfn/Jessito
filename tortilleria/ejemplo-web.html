<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi página con la tortillería 3D</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    model-viewer { width: 100%; height: 500px; background: #3a2a24; }
  </style>
</head>
<body>
  <!-- tortilleria.glb debe estar en la misma carpeta que este archivo -->
  <model-viewer
    src="tortilleria.glb"
    alt="Tortillería en 3D"
    camera-controls        
    disable-zoom           
    disable-pan
    auto-rotate
    camera-orbit="30deg 70deg auto"
    min-camera-orbit="auto 20deg auto"
    max-camera-orbit="auto 90deg auto"
    shadow-intensity="1"
    exposure="0.9">
  </model-viewer>
</body>
</html>
