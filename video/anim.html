<!doctype html><html><body style="margin:0;background:#000"><div id="s" style="width:1080px;height:1920px"></div>
<script>
const W=1080,H=1920,DUR=24;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const eb=x=>{x=clamp(x);const c=1.70158*1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=(i)=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const COL=[{n:'ROJO',c:'#ff3b4e',d:'#c1182b',e:'🍎'},{n:'AZUL',c:'#2f8bff',d:'#1759c7',e:'🐳'},{n:'AMARILLO',c:'#ffd21f',d:'#d19a00',e:'⭐'},{n:'VERDE',c:'#38d66b',d:'#1a9a45',e:'🐸'}];
const SEG0=3,SEGL=4;
function bg(t){
 let o=`<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ff"/><stop offset="0.6" stop-color="#bfeaff"/><stop offset="1" stop-color="#fff6d6"/></linearGradient>
 <radialGradient id="sun"><stop offset="0" stop-color="#fffbd0"/><stop offset="1" stop-color="#ffd54a"/></radialGradient>
 <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe07a"/><stop offset="1" stop-color="#2fae52"/></linearGradient></defs>
 <rect width="${W}" height="${H}" fill="url(#sk)"/>`;
 // sun rays
 o+=`<g transform="translate(860 330)">`;
 for(let i=0;i<14;i++){o+=`<polygon points="0,0 -40,-700 40,-700" fill="#fff7b0" opacity="0.22" transform="rotate(${i*360/14+t*6})"/>`}
 o+=`<circle r="${135+Math.sin(t*3)*6}" fill="url(#sun)"/><circle r="105" fill="#fff9c9" opacity=".7"/>
 <circle cx="-35" cy="-8" r="9" fill="#e8861c"/><circle cx="35" cy="-8" r="9" fill="#e8861c"/><path d="M-30 30 Q0 62 30 30" stroke="#e8861c" stroke-width="9" fill="none" stroke-linecap="round"/></g>`;
 // clouds
 for(let i=0;i<5;i++){const x=((i*330+t*(18+i*5))%1600)-250,y=200+i*190+Math.sin(t+i)*14,s=0.8+rnd(i)*0.7;
  o+=`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity="0.95"><ellipse cx="0" cy="0" rx="130" ry="48"/><circle cx="-50" cy="-30" r="55"/><circle cx="25" cy="-48" r="68"/><circle cx="85" cy="-14" r="42"/><ellipse cx="-30" cy="22" rx="110" ry="18" fill="#e4f4ff"/></g>`}
 // hills
 o+=`<path d="M0 1180 Q250 980 520 1130 T1080 1060 V1920 H0Z" fill="#8be58f"/><path d="M0 1260 Q300 1100 640 1230 T1080 1180 V1920 H0Z" fill="#52c866"/>`;
 o+=`<rect y="1360" width="${W}" height="560" fill="url(#gr)"/>`;
 // flowers
 for(let i=0;i<16;i++){const x=40+i*68+rnd(i)*20,y=1450+rnd(i+9)*400,sw=Math.sin(t*2.2+i)*7,s=0.7+y/1920*0.7;
  const fc=['#ff6fb5','#fff','#ffb3e1','#ff9a3c'][i%4];
  o+=`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 0 Q${sw} -40 ${sw*1.6} -75" stroke="#1f8a3d" stroke-width="7" fill="none"/><g transform="translate(${sw*1.6} -80)">`;
  for(let k=0;k<5;k++)o+=`<ellipse cx="0" cy="-17" rx="12" ry="19" fill="${fc}" transform="rotate(${k*72})"/>`;
  o+=`<circle r="11" fill="#ffd21f"/></g></g>`}
 // butterflies
 for(let i=0;i<3;i++){const x=540+Math.sin(t*0.7+i*2)*420,y=900+i*140+Math.cos(t*1.1+i)*70,f=Math.abs(Math.sin(t*14+i));
  o+=`<g transform="translate(${x} ${y})"><ellipse rx="${34*f+4}" ry="26" cx="-${20*f+4}" fill="#ff7ad9"/><ellipse rx="${34*f+4}" ry="26" cx="${20*f+4}" fill="#ff9be6"/><rect x="-3" y="-20" width="6" height="40" rx="3" fill="#4a2a5a"/></g>`}
 return o}
function bunny(t,x,y,sx,sy,air,vy){
 const blink=(t%3.2)<0.12?0.1:1, ear=Math.sin(t*5)*6-vy*0.012, arm=air?-60:Math.sin(t*4)*8;
 let o=`<g transform="translate(${x} ${y}) scale(${sx} ${sy})">`;
 o+=`<ellipse cx="0" cy="0" rx="150" ry="22" fill="#000" opacity="${0.18}" transform="translate(0 ${air?0:0})" style="display:none"/>`;
 // ears
 for(const s of[-1,1]){o+=`<g transform="translate(${s*55} -330) rotate(${s*(12+ear)})"><ellipse cx="0" cy="-95" rx="46" ry="125" fill="#fff"/><ellipse cx="0" cy="-90" rx="26" ry="95" fill="#ffb0cf"/></g>`}
 // feet
 o+=`<ellipse cx="-80" cy="12" rx="70" ry="38" fill="#fff" stroke="#e7dfe9" stroke-width="5"/><ellipse cx="80" cy="12" rx="70" ry="38" fill="#fff" stroke="#e7dfe9" stroke-width="5"/>`;
 // body
 o+=`<ellipse cx="0" cy="-95" rx="120" ry="135" fill="#fff" stroke="#e7dfe9" stroke-width="5"/><ellipse cx="0" cy="-80" rx="72" ry="95" fill="#ffe9f3"/>`;
 // arms
 o+=`<ellipse cx="-125" cy="-110" rx="26" ry="55" fill="#fff" stroke="#e7dfe9" stroke-width="5" transform="rotate(${20+arm} -125 -150)"/><ellipse cx="125" cy="-110" rx="26" ry="55" fill="#fff" stroke="#e7dfe9" stroke-width="5" transform="rotate(${-20-arm} 125 -150)"/>`;
 // head
 o+=`<ellipse cx="0" cy="-285" rx="150" ry="125" fill="#fff" stroke="#e7dfe9" stroke-width="5"/>`;
 o+=`<ellipse cx="-92" cy="-250" rx="30" ry="20" fill="#ff9ec4" opacity=".75"/><ellipse cx="92" cy="-250" rx="30" ry="20" fill="#ff9ec4" opacity=".75"/>`;
 for(const s of[-1,1]){o+=`<g transform="translate(${s*58} -295) scale(1 ${blink})"><ellipse rx="34" ry="42" fill="#2b1a3f"/><circle cx="-8" cy="-14" r="13" fill="#fff"/><circle cx="10" cy="14" r="6" fill="#fff"/></g>`}
 o+=`<ellipse cx="0" cy="-255" rx="16" ry="11" fill="#ff6f9f"/>`;
 o+= air? `<path d="M-30 -235 Q0 -170 30 -235Z" fill="#8a1c3d" stroke="#2b1a3f" stroke-width="5" stroke-linejoin="round"/><ellipse cx="0" cy="-212" rx="14" ry="9" fill="#ff7a9a"/>`
        : `<path d="M-32 -240 Q-16 -212 0 -240 Q16 -212 32 -240" stroke="#2b1a3f" stroke-width="6" fill="none" stroke-linecap="round"/>`;
 o+=`<path d="M-25 -215 l0 0" /><circle cx="-25" cy="-233" r="3" fill="#2b1a3f"/>`;
 // bow tie
 o+=`<g transform="translate(0 -170)"><polygon points="0,0 -50,-26 -50,26" fill="#ff4f8b"/><polygon points="0,0 50,-26 50,26" fill="#ff4f8b"/><circle r="14" fill="#c92466"/></g>`;
 return o+`</g>`}
function balloon(x,y,c,d,rot){return `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 150 Q-30 260 10 340 T0 470" stroke="#fff" stroke-width="5" fill="none" opacity=".9"/><path d="M0 150 l-18 28 h36z" fill="${d}"/><ellipse cx="0" cy="0" rx="118" ry="150" fill="${c}"/><ellipse cx="0" cy="0" rx="118" ry="150" fill="none" stroke="${d}" stroke-width="6"/><ellipse cx="-45" cy="-60" rx="22" ry="45" fill="#fff" opacity=".55" transform="rotate(20 -45 -60)"/></g>`}
function conf(t0,t,x,y,c,d){ // t since pop
 let o='';if(t<0||t>2.4)return o;
 const cols=[c,d,'#fff','#ffd21f','#ff6fb5','#4fc3ff'];
 for(let i=0;i<46;i++){const a=rnd(i)*6.283,v=300+rnd(i+50)*650,px=x+Math.cos(a)*v*t,py=y+Math.sin(a)*v*t+900*t*t*0.6;
  o+=`<rect x="-9" y="-5" width="18" height="10" rx="2" fill="${cols[i%6]}" opacity="${clamp(1-t/2.4)}" transform="translate(${px} ${py}) rotate(${t*(300+i*20)})"/>`}
 const r=eo(t/0.5)*520;o+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c}" stroke-width="${40*(1-clamp(t/0.5))}" opacity="${1-clamp(t/0.5)}"/>`;
 return o}
function text(str,x,y,size,sc,fill,stroke,rot=0){return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><text text-anchor="middle" font-family="Fredoka One,Comic Sans MS,Arial Rounded MT Bold,Verdana,sans-serif" font-weight="900" font-size="${size}" fill="${stroke}" stroke="${stroke}" stroke-width="30" stroke-linejoin="round" y="8">${str}</text><text text-anchor="middle" font-family="Fredoka One,Comic Sans MS,Arial Rounded MT Bold,Verdana,sans-serif" font-weight="900" font-size="${size}" fill="${fill}" y="0">${str}</text></g>`}
function frame(f){
 const t=f/30;let o=bg(t);
 const gy=1470;let bx=540,by=gy,sx=1,sy=1,air=false,vy=0,fg='';
 let bounce=Math.abs(Math.sin(t*3.2));
 // idle bounce default
 by=gy-bounce*28; sy=1+(0.5-bounce)*0.04;
 const segI=Math.floor((t-SEG0)/SEGL);
 if(t>=SEG0&&t<SEG0+4*SEGL){
  const k=COL[segI],s=t-SEG0-segI*SEGL;
  // balloon travel
  const bxp=540+(1-eo(s/1.6))*(segI%2?-700:700)+Math.sin(t*2)*18, byp=640+Math.sin(t*2.5)*22+(1-eo(s/1.6))*-200;
  const jumpT0=1.4;
  if(s<2.35){o+=balloon(bxp,byp,k.c,k.d,Math.sin(t*2.5)*5)}

  if(s>=jumpT0&&s<jumpT0+0.25){const p=(s-jumpT0)/0.25;sy=1-0.22*Math.sin(p*Math.PI);sx=1+0.18*Math.sin(p*Math.PI);by=gy}
  else if(s>=jumpT0+0.25&&s<2.35+0.0){const p=(s-jumpT0-0.25)/(2.35-jumpT0-0.25);const h=4*p*(1-p)*560;by=gy-h;air=true;vy=(1-2*p)*-800;sy=1+0.16*Math.abs(1-2*p);sx=1-0.08*Math.abs(1-2*p)}
  else if(s>=2.35&&s<3.1){const p=(s-2.35)/0.75;const h=Math.max(0,1-p*p)*60*(1-p); by=gy-h; air=p<0.7; sy=1; if(p>0.85){}}
  if(s>=2.35){const ps=s-2.35;o+=conf(0,ps,540,640,k.c,k.d);
   if(ps<0.08)o+=`<rect width="${W}" height="${H}" fill="#fff" opacity="${0.6*(1-ps/0.08)}"/>`;
   fg+=text(k.n,540,330,k.n.length>6?200:260,eb(ps/0.45),k.c,'#fff',Math.sin(ps*6)*3);
   fg+=`<text x="540" y="${900+Math.sin(t*6)*12}" font-size="${240*eb(ps/0.5)}" text-anchor="middle">${k.e}</text>`}
  if(s>=3.55&&s<SEGL){} // gap
 } else if(t<SEG0){
  const p=t/SEG0;
  fg+=text('JESSITO',540,360+Math.sin(t*3)*8,230,eb(p/0.4),'#ff5fa8','#fff',-4+Math.sin(t*2)*2);
  fg+=text('aprende los',540,520,100,eb((p-0.15)/0.4),'#2f8bff','#fff');
  fg+=text('COLORES',540,670,190,eb((p-0.3)/0.4),'#ffb800','#fff',3);
  by=gy-Math.abs(Math.sin(t*4.5))*70;air=false;
 } else if(t>=SEG0+4*SEGL){
  const s=t-SEG0-4*SEGL;
  by=gy-Math.abs(Math.sin(t*5))*110;air=true;vy=Math.cos(t*5)*-400;
  for(let i=0;i<8;i++){const hx=140+i*115+Math.sin(t*3+i)*20,hy=1000-((t*140+i*210)%900);fg+=`<text x="${hx}" y="${hy}" font-size="70" text-anchor="middle" opacity=".9">${['💖','⭐','🎈','💛'][i%4]}</text>`}
  fg+=text('¡SUSCRÍBETE!',540,330,170,eb(s/0.5),'#ff3b4e','#fff',-3);
  fg+=text('y dale 🔔',540,500,120,eb((s-0.3)/0.5),'#2f8bff','#fff',2);
  fg+=text('Nuevo video cada día',540,640,72,eb((s-0.6)/0.5),'#7a3cff','#fff');
 }
 // shadow
 const sh=clamp(1-(gy-by)/900,0.3,1);
 o+=`<ellipse cx="${bx}" cy="${gy+30}" rx="${150*sh}" ry="${26*sh}" fill="#0b4d1f" opacity="0.28"/>`;
 o+=bunny(t,bx,by,sx,sy,air,vy);o+=fg;
 // vignette
 o+=`<rect width="${W}" height="${H}" fill="none" stroke="#fff" stroke-width="0"/>`;
 document.getElementById('s').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${o}</svg>`}
window.frame=frame;frame(0);
</script></body></html>
