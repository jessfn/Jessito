<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Baloo 2';font-weight:800;src:url(fonts/baloo2-800.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-weight:700;src:url(fonts/fredoka-700.woff2) format('woff2')}
</style></head><body style="margin:0;background:#000"><div id="s" style="width:1080px;height:1920px"></div>
<script src="rive/timeline3.js"></script>
<script>
const W=1080,H=1920,GY=1470,clamp=cl,eo=x=>1-Math.pow(1-cl(x),3),sst=ss3;
const eb=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=i=>{const v=Math.sin(i*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const f1=n=>n.toFixed(1);
const mixc=(h,m,t)=>{const p=v=>parseInt(h.slice(v,v+2),16);return '#'+[p(1),p(3),p(5)].map(c=>Math.round(c+(m-c)*t).toString(16).padStart(2,'0')).join('')};
const FF="'Baloo 2','Fredoka','Arial Rounded MT Bold',Verdana,sans-serif";
/* ---------- elementos ---------- */
function balloon(x,y,c,d,rot,sx,sy){return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${f1(sx*100)/100} ${f1(sy*100)/100})"><path d="M0 150 Q-30 260 10 340 T0 470" stroke="#fff" stroke-width="5" fill="none" opacity=".9"/><path d="M0 146 l-20 30 h40z" fill="${d}"/><ellipse rx="116" ry="148" fill="${c}"/><ellipse cx="-44" cy="-58" rx="22" ry="44" fill="#fff" opacity=".5" transform="rotate(20 -44 -58)"/><ellipse cx="40" cy="62" rx="50" ry="70" fill="${d}" opacity=".18"/></g>`}
const star4=(x,y,r,rot,fill,op=1)=>`<path d="M0 ${-r} Q${r*.14} ${-r*.14} ${r} 0 Q${r*.14} ${r*.14} 0 ${r} Q${-r*.14} ${r*.14} ${-r} 0 Q${-r*.14} ${-r*.14} 0 ${-r}Z" fill="${fill}" opacity="${op}" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)})"/>`;
function sparks(x,y,t,n,R,cols){let o='';for(let i=0;i<n;i++){const a=i*6.283/n+Math.sin(t*.7)*.3,r=R*(.8+.4*rnd(i)),tw=.5+.5*Math.sin(t*6+i*1.7);o+=star4(x+Math.cos(a)*r*1.3,y+Math.sin(a)*r*.55,16+20*rnd(i+3)*tw,t*40+i*20,cols[i%cols.length],.4+.6*tw)}return o}
function fx(ts,x,y,c,d){let o='';if(ts<0||ts>2.4)return o;const cols=[c,d,'#fff','#ffd21f','#ff6fb5','#4fc3ff'];
 for(let i=0;i<56;i++){const a=rnd(i)*6.283,v=300+rnd(i+50)*700,px=x+Math.cos(a)*v*ts,py=y+Math.sin(a)*v*ts+900*ts*ts*.6;o+=`<rect x="-9" y="-5" width="18" height="10" rx="3" fill="${cols[i%6]}" opacity="${clamp(1-ts/2.4)}" transform="translate(${f1(px)} ${f1(py)}) rotate(${f1(ts*(300+i*20))})"/>`}
 for(let i=0;i<9;i++){const a=i*.7+rnd(i)*.4,v=520+rnd(i+7)*380,px=x+Math.cos(a)*v*ts,py=y+Math.sin(a)*v*ts+700*ts*ts;o+=`<path d="M-30 0 Q0 -22 30 0 Q0 -8 -30 0Z" fill="${c}" opacity="${clamp(1-ts/1.3)}" transform="translate(${f1(px)} ${f1(py)}) rotate(${f1(a*57+ts*500)})"/>`}
 for(let i=0;i<14;i++){const a=rnd(i+90)*6.283,v=250+rnd(i+70)*700,px=x+Math.cos(a)*v*ts,py=y+Math.sin(a)*v*ts+800*ts*ts*.6;o+=star4(px,py,15+14*rnd(i),ts*300+i*40,cols[(i+3)%6],clamp(1.3-ts/1.8))}
 const r=eo(ts/.5)*520;o+=`<circle cx="${x}" cy="${y}" r="${f1(r)}" fill="none" stroke="${c}" stroke-width="${f1(40*(1-clamp(ts/.5)))}" opacity="${1-clamp(ts/.5)}"/>`;
 return o}
function dust(ts,x){let o='';if(ts<0||ts>.6)return o;for(let i=0;i<7;i++){const sd=i%2?1:-1,d=(1+i>>1)*40*eo(ts/.6),r=(18+i*4)*(1+ts*1.5);o+=`<circle cx="${f1(x+sd*(70+d*1.4))}" cy="${f1(GY+14-ts*60-(i>>1)*6)}" r="${f1(r)}" fill="#fff" opacity="${(.75*(1-ts/.6)).toFixed(2)}"/>`}return o}
function sunburst(x,y,ts,c,op=.3){let o=`<g transform="translate(${x} ${y}) rotate(${f1(ts*16)})" opacity="${(op*eo(ts/.25)*(1-clamp((ts-1.7)/.9))).toFixed(3)}">`;for(let i=0;i<14;i++)o+=`<polygon points="0,0 -90,-900 90,-900" fill="${c}" transform="rotate(${i*360/14})"/>`;return o+`</g>`}

/* ---------- texto plano moderno ---------- */
function txt(ts,x,y,size,sc,fill,rot=0,sw=null,stc='#fff'){const k=size/200,stw=sw??Math.max(10,24*k);
 return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${f1(Math.max(sc,0)*100)/100})" filter="url(#ds)"><text text-anchor="middle" font-family="${FF}" font-weight="800" font-size="${size}" fill="${fill}" stroke="${stc}" stroke-width="${f1(stw)}" stroke-linejoin="round" paint-order="stroke" y="8">${ts}</text></g>`}
function word(str,x,y,size,sc,fill,rot,tt){let ts='',pv=0;[...str].forEach((ch,i)=>{const o=-55*Math.sin(clamp((tt-.2-i*.06)/.32)*Math.PI)+Math.sin(tt*5-i*.6)*3*clamp((tt-.8)/.4);ts+=`<tspan dy="${f1(o-pv)}">${ch}</tspan>`;pv=o});return txt(ts,x,y,size,sc,fill,rot)}
const RAINBOW=['#ff4757','#ff8a3d','#ffc42e','#2fd06b','#2f8bff','#7a5cff','#ff5fa8'];


/* ---------- fondo: cielo de atardecer sonador ---------- */
function bg3(t,night){
 let o=`<defs>
 <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4d3fc0"/><stop offset=".38" stop-color="#8d6cec"/><stop offset=".72" stop-color="#f69ed1"/><stop offset="1" stop-color="#ffdcbd"/></linearGradient>
 <radialGradient id="mg"><stop offset="0" stop-color="#fff4cf" stop-opacity=".9"/><stop offset="1" stop-color="#fff4cf" stop-opacity="0"/></radialGradient>
 <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset="1" stop-color="#d9002f"/></linearGradient>
 <radialGradient id="vig" cx=".5" cy=".5" r=".78"><stop offset=".62" stop-color="#1b1060" stop-opacity="0"/><stop offset="1" stop-color="#1b1060" stop-opacity=".3"/></radialGradient>
 <linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/></linearGradient>
 <filter id="ds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#1b1060" flood-opacity=".32"/></filter>
 <mask id="mn"><rect x="-200" y="-200" width="400" height="400" fill="#fff"/><circle cx="46" cy="-18" r="92" fill="#000"/></mask></defs>
 <rect x="-60" y="-60" width="${W+120}" height="${H+120}" fill="url(#sk)"/>`;
 // arcoiris suave
 const rc=['#ff7a8a','#ffb36b','#ffe27a','#8ee59a','#7ec8ff','#b69cff'];
 for(let i=0;i<6;i++)o+=`<circle cx="540" cy="1760" r="${1010-i*34}" fill="none" stroke="${rc[i]}" stroke-width="34" opacity=".28"/>`;
 // estrellas del fondo
 for(let i=0;i<46;i++){const x=rnd(i)*1080,y=rnd(i+7)*1000,r=1.6+rnd(i+3)*3.4,tw=.45+.55*Math.sin(t*(1.2+rnd(i+9))+i*2);o+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#fff" opacity="${(tw*.9).toFixed(2)}"/>`}
 for(let i=0;i<7;i++){const x=80+rnd(i+30)*920,y=60+rnd(i+31)*700,tw=.5+.5*Math.sin(t*2+i*1.9);o+=star4(x,y,14+14*tw,t*20+i*30,'#fff',.5+.5*tw)}
 // luna
 o+=`<g transform="translate(210 290)"><circle r="230" fill="url(#mg)"/><g mask="url(#mn)"><circle r="104" fill="#fff4cf"/></g></g>`;
 // nubes pasteles
 for(let i=0;i<5;i++){const x=((i*360+t*(12+i*5))%1700)-300,y=420+i*210+Math.sin(t*.7+i)*14,s=.8+rnd(i)*.6;
  o+=`<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(s)})" fill="${i%2?'#ffe1f1':'#fff'}" opacity="${i%2?.6:.5}"><rect x="-140" y="-10" width="300" height="64" rx="32"/><circle cx="-50" cy="-12" r="58"/><circle cx="34" cy="-34" r="74"/><circle cx="104" cy="2" r="44"/></g>`}
 // dunas suaves
 o+=`<path d="M-60 1560 Q260 1420 560 1520 T1140 1480 V1980 H-60Z" fill="#7a5fd9"/><path d="M-60 1640 Q320 1520 700 1620 T1140 1590 V1980 H-60Z" fill="#6148c4"/><path d="M-60 1740 Q300 1650 640 1730 T1140 1700 V1980 H-60Z" fill="#4c36a6"/>`;
 // luciernagas
 for(let i=0;i<16;i++){const x=(rnd(i+50)*1100+Math.sin(t*.8+i)*50)%1080,y=1500+Math.sin(t*.9+i*1.7)*120+rnd(i+60)*280,tw=.4+.6*Math.sin(t*2.2+i);o+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(5+tw*4)}" fill="#fff6b8" opacity="${(tw*.85).toFixed(2)}"/><circle cx="${f1(x)}" cy="${f1(y)}" r="16" fill="#fff6b8" opacity="${(tw*.18).toFixed(2)}"/>`}
 if(night>0)o+=`<rect x="-60" y="-60" width="${W+120}" height="${H+120}" fill="#1b1060" opacity="${(night*.38).toFixed(2)}"/>`;
 return o}
function platform(x,y,t,sc){const b=Math.sin(t*2)*4;return `<g transform="translate(${f1(x)} ${f1(y+b)}) scale(${f1(sc*100)/100})" filter="url(#ds)"><g fill="#fff"><rect x="-300" y="-30" width="600" height="86" rx="43"/><circle cx="-170" cy="-36" r="74"/><circle cx="-40" cy="-62" r="96"/><circle cx="110" cy="-42" r="76"/><circle cx="220" cy="-18" r="54"/></g><ellipse cx="0" cy="40" rx="260" ry="16" fill="#e8dcff" opacity=".7"/></g>`}
/* estrellita kawaii */
function kstar(x,y,R,col,t,i,face=true){const pts=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?R*.56:R;pts.push(f1(Math.cos(a)*r)+','+f1(Math.sin(a)*r))}
 const tw=1+.06*Math.sin(t*5+i*1.3),rot=Math.sin(t*2.6+i)*6;
 return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(rot)}) scale(${f1(tw*100)/100})" filter="url(#ds)"><polygon points="${pts.join(' ')}" fill="${col}" stroke="${col}" stroke-width="${f1(R*.34)}" stroke-linejoin="round"/><polygon points="${pts.join(' ')}" fill="${mixc(col,255,.5)}" opacity=".5" transform="scale(.62) translate(${f1(-R*.18)} ${f1(-R*.2)})"/>${face?`<g><ellipse cx="${f1(-R*.2)}" cy="${f1(R*.02)}" rx="${f1(R*.07)}" ry="${f1(R*.1)}" fill="#4a2c6b"/><ellipse cx="${f1(R*.2)}" cy="${f1(R*.02)}" rx="${f1(R*.07)}" ry="${f1(R*.1)}" fill="#4a2c6b"/><circle cx="${f1(-R*.18)}" cy="${f1(-R*.02)}" r="${f1(R*.025)}" fill="#fff"/><circle cx="${f1(R*.22)}" cy="${f1(-R*.02)}" r="${f1(R*.025)}" fill="#fff"/><path d="M${f1(-R*.1)} ${f1(R*.17)} Q0 ${f1(R*.3)} ${f1(R*.1)} ${f1(R*.17)}" stroke="#4a2c6b" stroke-width="${f1(R*.05)}" fill="none" stroke-linecap="round"/><ellipse cx="${f1(-R*.36)}" cy="${f1(R*.16)}" rx="${f1(R*.1)}" ry="${f1(R*.06)}" fill="#ff8fb7" opacity=".8"/><ellipse cx="${f1(R*.36)}" cy="${f1(R*.16)}" rx="${f1(R*.1)}" ry="${f1(R*.06)}" fill="#ff8fb7" opacity=".8"/></g>`:''}</g>`}

/* ---------- musical: contando estrellitas ---------- */
const NUMCOL=['#ff6b81','#ff9a4d','#ffc83d','#3fd983','#4d9bff'],STARCOL=['#ffd84a','#ffb3d9','#a8e0ff','#b8f0c8','#d9c2ff'],WORDS=['UNO','DOS','TRES','CUATRO','CINCO'],NOUN=['¡Una estrellita!','¡Dos estrellitas!','¡Tres estrellitas!','¡Cuatro estrellitas!','¡Cinco estrellitas!'];
const starT=(tb,i)=>tb+(i<4?i*B3:3.5*B3);
function badge(x,y,sc,col,label,size=210){return `<g transform="translate(${x} ${y}) scale(${f1(Math.max(sc,0)*100)/100})" filter="url(#ds)"><circle r="130" fill="#fff"/><circle r="130" fill="none" stroke="${col}" stroke-width="14"/><circle r="108" fill="${col}"/><text text-anchor="middle" y="${size*.36}" font-size="${size}" font-weight="800" fill="#fff" font-family="${FF}">${label}</text></g>`}
function numRow(t,y,lightAt){let o='';for(let i=0;i<5;i++){const x=540+(i-2)*165,ta=lightAt(i),on=t>=ta,sc=on?1+.28*Math.exp(-(t-ta)*7)*Math.cos((t-ta)*20)+.08:.9,col=NUMCOL[i];
 o+=`<g transform="translate(${x} ${y}) scale(${f1(sc*100)/100})" filter="url(#ds)" opacity="${on?1:.6}"><circle r="70" fill="${on?col:'#fff'}" stroke="${on?'#fff':col}" stroke-width="9"/><text text-anchor="middle" y="28" font-size="84" font-weight="800" fill="${on?'#fff':col}" font-family="${FF}">${i+1}</text></g>`}return o}
function arcStars(t,n,tb){let o='';const sp=Math.min(200,860/Math.max(n,1));
 for(let i=0;i<n;i++){const ta=starT(tb,i),age=t-ta;if(age<0)continue;const sc=Math.max(eb(age/.35),0),c=i-(n-1)/2,x=540+c*sp,y=640+26*Math.abs(c)**1.5-Math.abs(Math.sin(((t/B3)+i*.37)%1*Math.PI))*18;
  o+=`<g transform="translate(${f1(x)} ${f1(y)}) scale(${f1(sc*100)/100}) translate(${f1(-x)} ${f1(-y)})">${kstar(x,y,92,STARCOL[i%5],t,i)}</g>`;
  if(age<.55)o+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(70+age*320)}" fill="none" stroke="#fff" stroke-width="${f1(8*(1-age/.55))}" opacity="${(1-age/.55).toFixed(2)}"/>`+star4(x+60,y-60,22*(1-age/.55)+8,age*200,'#fff',1-age/.55)}
 return o}
function orbit(t,t0){let o='';for(let i=0;i<5;i++){const a=(t-t0)*1.6+i*Math.PI*2/5,x=540+Math.cos(a)*400,y=1000+Math.sin(a)*190-80;o+=kstar(x,y,84,STARCOL[i],t,i)+star4(x+Math.cos(a+1)*70,y-70,14,t*100+i*30,'#fff',.8)}return o}
function notes(t){let o='';for(let k=0;k<12;k++){const tn=Math.floor(t/B3)*B3-k*B3,age=t-tn;if(age>3.2||tn<0)continue;const j=Math.round(tn/B3),x=540+(rnd(j)-.5)*760+Math.sin(age*3+j)*40,y=1300-age*300;o+=`<text x="${f1(x)}" y="${f1(y)}" font-size="${f1(50+rnd(j+4)*24)}" text-anchor="middle" opacity="${(Math.max(0,1-age/3.2)*.8).toFixed(2)}">${['🎵','🎶','✨','🎵'][j%4]}</text>`}return o}

function frame(f){
 const t=f/30,P=plan3(t);let mid='',ui='',zoom=1.05;
 const bar=Math.floor(t/BAR3),tbb=t-bar*BAR3,pulse=P.pulse;
 const sleepT=11*BAR3+.9,night=sst(sleepT-.4,sleepT+1.2,t);
 let world=bg3(t,night);
 world+=`<circle cx="210" cy="290" r="${f1(250+30*pulse)}" fill="#fff4cf" opacity="${(.12*pulse).toFixed(2)}"/>`;
 if(t>=BAR3&&t<10*BAR3)world+=notes(t);
 if(bar===0){const p=t/BAR3;ui+=txt('¡CONTEMOS!',540,300+Math.sin(t*3)*6,170,eb((p-.05)/.3),'#ffd84a',-3+Math.sin(t*2)*2);
  let cs='';[...'ESTRELLITAS'].forEach((ch,i)=>{cs+=`<tspan fill="${RAINBOW[i%7]}">${ch}</tspan>`});ui+=txt(cs,540,470,112,eb((p-.3)/.3),'#ff9a4d',2)}
 else if(bar>=1&&bar<=5){const n=bar,col=NUMCOL[n-1];
  ui+=badge(540,270,eb(tbb/.4)*(1+.05*pulse),col,String(n));
  ui+=txt(WORDS[n-1],540,480,n>3?110:140,eb((tbb-.12)/.4),col,0);
  mid+=arcStars(t,n,bar*BAR3);
  const ca=t-(bar*BAR3+2*B3);if(ca>=0)ui+=txt(NOUN[n-1],540,1790,n>=4?88:104,eb(ca/.35)*(1+.03*pulse),'#fff',0,15,'#6d4fd0')}
 else if(bar<=7){const s=t-6*BAR3,tj=7*BAR3+2*B3;
  ui+=txt(t<tj?'¡OTRA VEZ!':'¡MUY BIEN!',540,300,t<tj?155:145,eb(t<tj?(s-.02)/.3:(t-tj)/.3),t<tj?'#ffb347':'#7ef0a8',-2);
  ui+=numRow(t,470,i=>6*BAR3+(1+i)*B3);
  if(t>=tj)world+=fx(t-tj,540,360,'#ffd84a','#ff9a4d');
  for(let i=0;i<5;i++){const ta=6*BAR3+(1+i)*B3;if(t>=ta&&t<ta+.4)world+=star4(540+(i-2)*165,470,56*(1-(t-ta)/.4)+20,(t-ta)*200,'#fff',1-(t-ta)/.4)}
  mid+=orbit(t,6*BAR3)}
 else if(bar<=9){const s=t-8*BAR3;
  ui+=txt('¡TODAS JUNTAS!',540,300,128,eb((s-.02)/.3),'#ffe066',-2+Math.sin(t*4)*2);
  ui+=numRow(t,470,i=>8*BAR3+(2+i)*B3);mid+=orbit(t,8*BAR3);
  for(let b=0;b<6;b++){const te=8*BAR3+b*B3*1.5;if(t>=te&&t<te+2.4)world+=fx(t-te,540+(b%2?-1:1)*200,420,STARCOL[b%5],'#fff')}
  world+=sunburst(540,700,t-8*BAR3,'#ffe9a8',.2)}
 else {const e=t-10*BAR3;world+=sunburst(540,700,e,'#ffd2ef',.22)+sparks(540,700,t,10,360,['#fff','#ffe066','#ffb3e1']);
  if(t<sleepT-.2){ui+=txt('¡SUSCRÍBETE!',540,300,138,eb((e-.2)/.5),'#ff6b81',-3)+txt('y activa la campanita',540,455,84,eb((e-.5)/.5),'#7ec8ff',2)}
  else ui+=txt('¡BUENAS NOCHES!',540,320,92,eb((t-sleepT)/.5),'#fff',0,13,'#6d4fd0')+txt('dulces sueños',540,440,78,eb((t-sleepT-.3)/.5),'#ffd2ef',0,13,'#6d4fd0');
  if(e>1.2){const u=eb((e-1.2)/.4),pr=e>2?(e<2.2?.9:1):1;ui+=`<g transform="translate(540 1760) scale(${f1(u*pr*100)/100})"><rect x="-224" y="-46" width="460" height="120" rx="60" fill="#1b1060" opacity=".28"/><rect x="-230" y="-60" width="460" height="120" rx="60" fill="url(#btn)" stroke="#fff" stroke-width="10"/><path d="M-170 -32 l50 32 l-50 32z" fill="#fff"/><text x="50" y="16" text-anchor="middle" font-size="46" font-weight="800" fill="#fff" font-family="${FF}">SUSCRIBIRME</text><g transform="translate(330 -10) rotate(${f1(Math.sin(t*14)*22)} 0 -50)"><path d="M0 -60 q-45 0 -45 50 v30 h-15 v14 h120 v-14 h-15 v-30 q0 -50 -45 -50z" fill="#ffc42e" stroke="#fff" stroke-width="8"/><circle cy="40" r="14" fill="#d49100"/></g></g>`}
  if(e>=1.5)ui+=`<text x="540" y="1868" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" opacity="${(.9*sst(1.5,2,e)).toFixed(2)}" font-family="Fredoka,sans-serif" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))">Personaje: AnggaMotion · Rive (CC BY 4.0)</text>`}
 zoom+=.01*pulse;
 // personaje (nubecita) sobre su nube
 const cy=1010+P.Y+(P.art==='4'?150:0),sc=1.25*P.SX,sy=1.25*P.SY;
 if(P.art!=='4')mid=platform(540,1345,t,1)+mid+'';else mid=platform(540,1345,t,1.05)+mid;
 const charG=`<g transform="translate(${f1(P.X)} ${f1(cy)}) rotate(${f1(P.ROT*57.3)}) scale(${f1(sc*1000)/1000} ${f1(sy*1000)/1000})"><image href="rive/spr3/s${String(f).padStart(4,'0')}.png" x="-480" y="-480" width="960" height="960"/></g>`;
 const cam=`translate(540 1000) translate(${f1(Math.sin(t*1.3)*2)} ${f1(Math.cos(t*1.7)*2)}) scale(${f1(zoom*1000)/1000}) translate(-540 -1000)`;
 document.getElementById('s').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><g transform="${cam}">${world}${mid}${charG}</g><rect width="${W}" height="${H}" fill="url(#vig)"/>${ui}</svg>`}
window.frame=frame;frame(0);
</script></body></html>
